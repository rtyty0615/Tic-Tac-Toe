<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div id="start">
        <dialog>
            <form method="dialog">
                <div>
                    <label for="player-one">Player One's Name: </label>
                    <input type="text" id="player-one" name="player-one">
                </div>
                <div>
                    <label for="player-two">Player Two's Name: </label>
                    <input type="text" id="player-two" name="player-two">
                </div>
                <div>
                    <button id="cancel-btn" type="button" value="cancel" formnovalidate>Cancel</button>
                    <button id="submit-btn" type="submit">Submit</button>
                </div>
        
            </form>
        </dialog>
    </div>
    <h1 id="turn"></h1>
    <div id="board"></div>
    <h1 id="result"></h1>
</body>
</html>
